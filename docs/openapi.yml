            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Emoji not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /emojis/{emoji_id}/icon:
    parameters:
      - $ref: '#/components/parameters/EmojiId'
    get:
      summary: Get a custom emoji's icon
      description: >-
        Public endpoint, no authentication required. Streams the stored webp (or
        animated webp) icon. The `hash` query parameter is required and must
        equal the emoji's current `icon_hash`, otherwise 404. The response is
        immutable for a given hash, so it is safe to cache.
      tags: [emojis]
      operationId: getEmojiIcon
      security: []
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Icon not found (unknown emoji or hash mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a custom emoji's icon
      description: >-
        Requires `modify_emoji` on the emoji's guild. The body is a raw image
        with `Content-Type` `image/webp`, `image/gif`, `image/png`, `image/jpeg`
        or `image/jpg` (an
        unsupported type is `415`) and must be within the `media.emoji` caps; it
        is re-encoded to WebP (animations to animated WebP), hashed and stored,
        replacing the existing icon. On success the new `icon_hash` is returned
        so the client can fetch the image from
        `GET /emojis/{emoji_id}/icon?hash={icon_hash}`. Dispatches an
        `emoji_updated` gateway event.
      tags: [emojis]
      operationId: updateEmojiIcon
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: >-
          Raw image bytes. The request `Content-Type` must be `image/webp`,
          `image/gif`, `image/png`, `image/jpeg` or `image/jpg`; any other
          type is rejected with 415.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [icon_hash]
                properties:
                  icon_hash:
                    type: string
                    pattern: '^[0-9a-f]{16}$'
                    description: >-
                      XXHash64 of the stored webp icon, 16 lowercase hex chars.
                      Fetch the image from
                      `GET /emojis/{emoji_id}/icon?hash={icon_hash}`.
        '400':
          description: Bad image or unknown query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (modify_emoji required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The content type is not image/webp, image/gif, image/png, image/jpeg or image/jpg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Emoji not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body exceeds media.emoji.max_input_bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds/{guild_id}/channels:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: List guild channels (full objects)
      tags: [channels]
      operationId: getGuildChannels
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Channel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a channel
      tags: [channels]
      operationId: postGuildChannel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind]
              properties:
                name:
                  type: string
                  format: display-name
                  description: Max `api.channels.max_name_codepoints`
                topic:
                  type: string
                  format: display-name
                  description: Only for kind="channel"; max `api.channels.max_topic_codepoints`
                kind:
                  type: string
                  enum: ["channel", "category"]
                parent_id:
                  allOf:
                    - $ref: '#/components/schemas/Id'
                  description: Category channel; forbidden when kind="category"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (create_channels required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild or parent channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds/{guild_id}/channels/order:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    put:
      summary: Reorder a guild's channels within one parent (modify_channels required)
      description: |
        Sets the order of the children of one scope in a single atomic request.
        `parent_id` selects the scope: `null`/absent means the root (categories
        and root channels), otherwise a category id. `channels` must list
        **exactly** the channels whose parent is that scope, each once, in the
        desired order; positions are then assigned densely as `0..K-1`.

        Every channel whose index changes must be modifiable by the caller
        (`modify_channels` computed on that channel); otherwise the request is a
        403. Channels whose index is unchanged are pinned and need no rights.
        Only ordering within one scope is affected — channels are not reparented.

        On success the server emits a `channels_reordered` gateway event
        carrying only `guild_id`; clients refetch
        `GET /guilds/{guild_id}/channels`.
      tags: [channels]
      operationId: putGuildChannelsOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channels]
              properties:
                parent_id:
                  allOf:
                    - $ref: '#/components/schemas/Id'
                  nullable: true
                  description: Category id, or null/absent for the root scope
                channels:
                  type: array
                  items:
                    $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (a moved channel lacks modify_channels)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild or parent channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds/{guild_id}/messages/search:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: Search a guild's messages
      description: >-
        Per-guild message search. All filters are optional and combine with AND;
        each id-list filter accepts a comma-separated list of decimal ids and
        matches any of them (OR within a filter). Results only include channels
        where the caller has effective `read_messages`: unreadable channels are
        silently excluded (never 403). The response is ordered by `sort` (newest
        first by default, oldest first when requested) and paginated with
        `offset`/`limit`; `total` is the exact number of matches and does not
        depend on the requested page.
      tags: [messages]
      operationId: searchGuildMessages
      security:
        - bearerAuth: []
      parameters:
        - name: content
          in: query
          schema:
            type: string
            format: message-body
          description: >-
            Case-insensitive substring match on message content. NFKC-normalized
            and counted in codepoints; must be between
            `api.search.min_content_codepoints` and
            `api.search.max_content_codepoints`.
        - name: authors
          in: query
          schema:
            type: string
          description: >-
            Comma-separated user ids; matches messages authored by any of them
            (at most `api.search.max_filter_ids`).
        - name: channels
          in: query
          schema:
            type: string
          description: >-
            Comma-separated channel ids; matches messages in any of them (at most
            `api.search.max_filter_ids`).
        - name: mentions
          in: query
          schema:
            type: string
          description: >-
            Comma-separated user ids; matches messages that mention any of them
            (at most `api.search.max_filter_ids`).
        - name: mention_roles
          in: query
          schema:
            type: string
          description: >-
            Comma-separated role ids; matches messages that mention any of them
            (at most `api.search.max_filter_ids`).
        - name: author_types
          in: query
          schema:
            type: string
          description: Comma-separated subset of `user`, `bot`, `webhook`.
        - name: has_attachments
          in: query
          schema:
            type: boolean
          description: >-
            `true` keeps only messages with at least one attachment; `false` only
            messages without any.
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: after
          in: query
          schema:
            type: integer
            format: int64
          description: >-
            Only messages created at or after this Unix time in milliseconds
            (inclusive).
        - name: before
          in: query
          schema:
            type: integer
            format: int64
          description: >-
            Only messages created strictly before this Unix time in
            milliseconds (exclusive).
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: >-
            Number of matching messages to skip (offset pagination). Default 0.
            Ignored by `total`.
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
          description: >-
            Sort order by message id: `newest` (default, descending) or
            `oldest` (ascending).
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Default 25, max `api.messages.max_messages_limit`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildMessageSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /guilds/{guild_id}/audit-log:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: Read a guild's audit log
      description: >-
        Per-guild, append-only log of management actions (channels, roles,
        overwrites, emojis, webhooks, guild updates, moderation). Entries carry
        the actor and the target ids only, never a before/after payload.
        Requires the guild-level `view_audit_log` permission. Results are
        ordered by `sort` (newest first by default) and paginated with
        `offset`/`limit`; `total` is the exact number of matches and does not
        depend on the requested page.
      tags: [guilds]
      operationId: getGuildAuditLog
      security:
        - bearerAuth: []
      parameters:
        - name: user
          in: query
          schema:
            type: string
          description: Decimal user id; keeps only entries performed by that actor.
        - name: action
          in: query
          schema:
            type: string
          description: >-
            Comma-separated action names (any of `guild_name_update`,
            `guild_avatar_update`, `guild_avatar_delete`, `channel_create`,
            `channel_name_update`, `channel_topic_update`,
            `channel_parent_update`, `channel_delete`, `channel_reorder`,
            `role_overwrite_update`, `member_overwrite_update`, `role_create`,
            `role_name_update`, `role_permissions_update`, `role_color_update`,
            `role_mentionable_update`, `role_delete`, `role_reorder`,
            `role_grant`, `role_revoke`, `emoji_create`, `emoji_name_update`,
            `emoji_icon_update`, `emoji_delete`, `webhook_create`,
            `webhook_name_update`, `webhook_avatar_update`,
            `webhook_avatar_delete`, `webhook_delete`, `message_delete`,
            `message_pin`, `message_unpin`); matches any of them.
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of matching entries to skip. Default 0.
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
          description: Sort order by entry id.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Default 25, max `api.audit_log.max_entries_limit`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [entries, total]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  total:
                    type: integer
                    description: Exact number of matches, independent of the page.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing `view_audit_log`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /guilds/{guild_id}/roles:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: List guild roles (full objects)
      tags: [roles]
      operationId: getGuildRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a guild role
      description: |
        Requires the granted-permissions rule (the requested permission mask must
        be a subset of the caller's guild base permissions). The caller must have
        at least one non-`@everyone` role. The new role is inserted at the
        bottom (position 1, shifting every other non-`@everyone` role up); the
        response carries only its id. Ordering is changed only through
        `PUT /guilds/{guild_id}/roles/order`.
      tags: [roles]
      operationId: postGuildRoles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name:
                  type: string
                  format: display-name
                  description: >-
                    Max `api.roles.max_name_codepoints`; forbidden codepoints
                    (Cc/Cf, zero-width, BiDi, ...) are rejected with 400
                    "'name' is invalid".
                permissions:
                  $ref: '#/components/schemas/PermissionBits'
                color:
                  type: integer
                  minimum: 0
                  maximum: 16777215
                  nullable: true
                mentionable:
                  type: boolean
                  nullable: true
                  description: Defaults to true when absent
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (subset rule or role hierarchy violated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds/{guild_id}/roles/order:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    put:
      summary: Reorder guild roles (modify_roles required)
      description: |
        Sets the order of the guild's roles in one atomic request. The body's
        `roles` array must list **every** non-`@everyone` role of the guild
        exactly once, in the desired order; `@everyone` (role id = guild id)
        must be absent. Positions are then assigned densely as `1..N`.

        Hierarchy is enforced by pinning: a role the caller cannot move (its
        current position is at or above the caller's highest role position)
        must keep its exact index
        in the list. Roles the caller can move may only be permuted within the
        segments between pinned roles; moving a pinned role is a 403. A role
        list that is not a permutation of the guild's roles is a 400.

        On success the server emits a `roles_reordered` gateway event carrying
        only `guild_id`; clients refetch `GET /guilds/{guild_id}/roles`.
      tags: [roles]
      operationId: putGuildRolesOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles]
              properties:
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/Id'
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (modify_roles, or a pinned role was moved)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      summary: Get a role (full object)
      tags: [roles]
      operationId: getRole
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleWithGuild'
        '400':
          description: Malformed role_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Modify a role (modify_roles required)
      description: |
        At least one of name / permissions / color / mentionable must be
        present; `"color": null` counts as present and clears the color. An
        explicit null in name / permissions is a 400 with the field's type
        error. The response is 204 — there are no server-derived fields to
        return. The required
        permission check includes the new permission mask: the caller may only
        grant permissions it already has (subset rule). Role hierarchy applies:
        the role's current position must be strictly below the caller's highest
        role position.
        The @everyone role (role_id = guild_id) only accepts a "permissions"
        change and is subject to the same hierarchy (its position is 0).
      tags: [roles]
      operationId: patchRole
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  format: display-name
                  description: >-
                    Max `api.roles.max_name_codepoints`; forbidden codepoints
                    (Cc/Cf, zero-width, BiDi, ...) are rejected with 400
                    "'name' is invalid".
                permissions:
                  $ref: '#/components/schemas/PermissionBits'
                color:
                  type: integer
                  minimum: 0
                  maximum: 16777215
                  nullable: true
                  description: null clears the color
                mentionable:
                  type: boolean
                  description: Absent leaves the value unchanged
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a role (delete_roles required)
      description: |
        The @everyone role (role_id = guild_id) cannot be deleted. Role
        hierarchy applies: the role's position must be strictly below the
        caller's highest role position. Assigned
        member roles are cascaded.
      tags: [roles]
      operationId: deleteRole
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions, or an attempt to delete the @everyone role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /roles/{role_id}/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
      - $ref: '#/components/parameters/UserId'
    put:
      summary: Grant a role to a member (grant_roles required)
      description: |
        Idempotent: granting a role the member already has is a 204 no-op.
        Role hierarchy: the role's position must be strictly below the caller's
        highest role position, and the caller's highest position must be strictly
        above the target member's highest position (consequently a member cannot
        grant roles to themselves). The @everyone role cannot be granted.
        Deleted users are reported as 404.
      tags: [roles]
      operationId: putRoleUser
      security:
        - bearerAuth: []
      responses:
        '204': { description: No Content }
        '400':
          description: Cannot grant the @everyone role
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Role not found or user not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      summary: Revoke a role from a member (revoke_roles required)
      description: |
        Idempotent: revoking a role the member does not have is a 204 no-op.
        Same role hierarchy and @everyone rules as PUT.
      tags: [roles]
      operationId: deleteRoleUser
      security:
        - bearerAuth: []
      responses:
        '204': { description: No Content }
        '400':
          description: Cannot revoke the @everyone role
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Role not found or user not found
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  /guilds/{guild_id}/members/{user_id}/roles:
    parameters:
      - $ref: '#/components/parameters/GuildId'
      - $ref: '#/components/parameters/UserId'
    get:
      summary: List role IDs assigned to a member (projection)
      tags: [roles]
      operationId: getMemberRoles
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK — resolve roles via GET /guilds/{guild_id}/roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      summary: Get a channel
      tags: [channels]
      operationId: getChannel
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelWithGuild'
        '400':
          description: Malformed channel_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Modify a channel (modify_channels required)
      description: >-
        At least one of name / topic / parent_id must be present.
        `"name": null` is a 400 ("'name' is not a string") — name is
        non-nullable; `"topic": null` resets the topic. `"parent_id": null`
        moves the channel to the root; a category only accepts an absent or
        null parent_id. The new parent must exist, belong to the same guild
        and be a category.
      tags: [channels]
      operationId: patchChannel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  format: display-name
                  description: Max `api.channels.max_name_codepoints`
                topic:
                  type: string
                  format: display-name
                  nullable: true
                  description: null resets the topic
                parent_id:
                  type: string
                  pattern: '^[0-9]+$'
                  nullable: true
                  description: Category channel; forbidden for categories
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Channel or new parent channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a channel (delete_channels required)
      description: Child channels are not deleted; their parent_id becomes null.
      tags: [channels]
      operationId: deleteChannel
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channel_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      summary: List messages (keyset pagination)
      description: before/after/around are mutually exclusive.
      tags: [messages]
      operationId: getMessages
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Default 50, max `api.messages.max_messages_limit`
        - name: before
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: after
          in: query
          schema:
            $ref: '#/components/schemas/Id'
        - name: around
          in: query
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          description: Bad parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Send a message (send_messages required)
      description: >-
        `content` follows `format: message-body`: it must be valid UTF-8;
        forbidden codepoints (controls except \n/\t, BiDi overrides, zero-width,
        tag characters are kept — see the conventions section) are stripped
        server-side before storage. After stripping, the content must not be
        empty and must not exceed `api.messages.max_codepoints_per_message`
        codepoints. An optional `reply_to_id` must reference an existing
        (not deleted) message in the same channel; a missing, deleted or
        other-channel target is rejected with 400 "'reply_to_id' is invalid".
        An optional `embeds` is a list of at most `api.messages.max_embeds`
        rich embeds (see the `Embed` schema); `null` or `[]` stores no embeds.
        Attachments are derived from `content`: every `attachment://<file_id>`
        reference yields a file id, deduplicated in first-appearance order.
        At most `api.messages.max_attachments` unique
        ids are accepted and every id must reference an existing file.
      tags: [messages]
      operationId: postMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: message-body
                reply_to_id:
                  allOf:
                    - $ref: '#/components/schemas/Id'
                  nullable: true
                embeds:
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/Embed'
                  description: >-
                    At most `api.messages.max_embeds`; `null` or an empty array
                    means no embeds.
                allowed_mentions:
                  allOf:
                    - $ref: '#/components/schemas/AllowedMentions'
                  nullable: true
                  description: >-
                    Filters which mentions parsed from `content` take effect; it
                    does not rewrite `content` and never rejects the message.
                    Absent = allow `users`, `roles` and `everyone`.
            example:
              content: Hello, world!
              reply_to_id: null
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: >-
            Bad JSON, content missing/not a string/empty/too long (max
            `api.messages.max_codepoints_per_message` after stripping),
            invalid UTF-8, an invalid reply target, an invalid embed, or a
            content attachment reference that is too many or does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (send_messages required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /channels/{channel_id}/messages/sync:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      summary: Changed channel messages since a cursor
      tags: [sync]
      operationId: getChannelMessagesSync
      security:
        - bearerAuth: []
      description: >-
        Returns only the ids of present messages changed since `since` (upserts).
        Requires `read_messages` on the channel. A soft-deleted message stays
        present and is therefore listed; the client drops it after fetching it
        and observing `deleted_at`. Hard deletions are not listed.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesSync'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /channels/{channel_id}/webhooks:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      summary: List the channel's webhooks
      description: >-
        Returns the channel's live (non-soft-deleted) webhooks in id order.
        Readable by any authenticated user (metadata is not permission-gated);
        the execute token is never included.
      tags: [webhooks]
      operationId: getChannelWebhooks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
        '400':
          description: Malformed channel_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a webhook (create_webhooks required)
      description: >-
        Creates a webhook on the channel. The channel must hold fewer than
        `api.webhooks.max_webhooks_per_channel` live webhooks, otherwise the
        request is rejected with 400 "'webhooks' is too many". The response is
        `201 {"id","token"}`; the plaintext `token` is returned exactly once and
        only its sha256 is stored. Soft-deleted webhooks do not count against
        the cap. Dispatches a `webhook_created` gateway event.
      tags: [webhooks]
      operationId: postChannelWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookToken'
        '400':
          description: >-
            Bad JSON, "'name' is missing"/"'name' is not a string"/"'name' is
            too long"/"'name' is invalid", or "'webhooks' is too many"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (create_webhooks required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /channels/{channel_id}/pins:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
