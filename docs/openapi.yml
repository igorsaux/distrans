openapi: '3.0.3'
info:
  title: Distrans
  version: '1.0.0'
  license:
    name: Apache-2.0
    url: https://spdx.org/licenses/Apache-2.0.html
  description: |
    Real-time chat API.

    Conventions:
    - All IDs are decimal strings of 64-bit snowflakes (JS BigInt compatible).
    - Permission masks (`permissions`, `allow`, `deny`) are 128-bit decimal strings.
      The defined bits: 0 read_messages, 1 send_messages, 2 delete_messages,
      3 create_channels, 4 modify_channels, 5 delete_channels, 6 create_roles,
      7 modify_roles, 8 delete_roles, 9 grant_roles, 10 revoke_roles,
      11 manage_overwrites, 12 skip_allows, 13 skip_denies, 14 guild_modify,
      15 add_reactions, 16 delete_reactions, 17 create_emoji, 18 modify_emoji,
      19 delete_emoji, 20 mention_everyone, 21 add_pins, 22 delete_pins,
      23 create_webhooks, 24 modify_webhooks, 25 delete_webhooks,
      26 view_audit_log;
      bits 27–127 are reserved and rejected on input. The skip bits are read
      from guild-level (base) permissions only: `skip_denies` makes all channel
      overwrite deny masks inert for the holder, `skip_allows` makes the allow
      masks inert; the overwrite tier order is preserved.
    - `created_at` values are Unix epoch milliseconds.
    - Errors are always `{ "message": "<text>" }`.
    - Endpoints that require a JSON body reject a request whose `Content-Type`
      is not `application/json` with `415` (`UnsupportedMediaType`); an empty
      body with the right type is `400`. A method that is not allowed on an
      already-matched path returns `405` with an `Allow` header listing the
      accepted methods (`MethodNotAllowed`); an unknown path is `404`.
    - `POST` endpoints that create a resource return `201` (`POST /files`
      returns `200` instead when the same bytes already exist and are reused).
    - PATCH endpoints return only fields the client cannot know on its own
      (server-generated/derived, e.g. `updated_at`); if there are none →
      `204 No Content`.
    - PATCH field semantics: an absent field is left unchanged; an explicit
      `"field": null` clears the field (nullable fields only); an explicit null
      in a non-nullable field is a 400 with the field's type error.
    - Text validation profiles (see the custom `format` keywords). All text
      except passwords is NFKC-normalized first; limits apply to the normalized
      form and the normalized form is what gets stored (for `password` the exact
      bytes are used).
      - `format: username` — allowlist `a-z`, `0-9`, `.`, `_` only; the first
        and the last characters must be alphanumeric; `..` is forbidden;
        reserved names are rejected.
      - `format: display-name` — user-visible names (guild/channel/role names,
        display names, topics): forbidden codepoints (Cc/Cf controls, format
        characters such as zero-width/BiDi/tag characters, line/paragraph
        separators, `Default_Ignorable_Code_Point`, noncharacters,
        `Bidi_Control`, blank braille pattern, private use area) are rejected
        with 400 `"'<field>' is invalid"`.
      - `format: message-body` — message text: forbidden codepoints are
        stripped server-side before storage, except `\n`/`\t`, ZWNJ/ZWJ, bidi
        marks/isolates, variation selectors and tag characters; after
        stripping, empty content is rejected (`"'content' is empty"`) and the
        codepoint limit applies.
      - Attachments are derived from `content`: any literal
        `attachment://<file_id>` (the scheme followed by decimal digits — the
        backend does not parse markdown, a media token such as
        `![name](attachment://<id>)` simply contains it) references a file. The
        unique ids, in first-appearance order, become the message's
        `attachments`; at most `api.messages.max_attachments` are accepted and
        every id must reference an existing file, otherwise 400. External
        `https://…` links are not attachments.
      - Embeds: a message carries at most `api.messages.max_embeds` rich
        embeds. Embed text uses the `message-body` profile; validation is
        strict (a present sub-object requires its fields) and `timestamp` is a
        non-negative integer Unix epoch in milliseconds, like `created_at`.
        Embed limits live under `api.embeds.*` (see `GET /limits`).
      - `format: emoji-name` — custom emoji names: allowlist `a-z`, `0-9`, `_`
        only (no positional rules), length within
        `api.emojis.min_name_codepoints` .. `api.emojis.max_name_codepoints`
        codepoints. Uniqueness is per guild.
servers:
  - url: https://localhost/api
tags:
  - name: meta
    description: Limits, terms of service and privacy policy.
  - name: auth
    description: Password login, refresh and logout.
  - name: users
    description: Users, profiles, avatars and userdata.
  - name: guilds
    description: Guilds, guild avatars and the audit log.
  - name: channels
    description: Channels, categories, ordering and overwrites.
  - name: messages
    description: Messages, pins and message search.
  - name: roles
    description: Role management, ordering and member assignments.
  - name: emojis
    description: Custom emoji management and icons.
  - name: webhooks
    description: Webhook management and execution.
  - name: files
    description: File uploads.
  - name: notifications
    description: Guild/channel notification settings and push subscriptions.
  - name: sync
    description: Incremental sync cursors.
  - name: system
    description: System-administration endpoints (system token).
  - name: gateway
    description: WebSocket gateway upgrade endpoint.
paths:
  /limits:
    get:
      summary: Get API limits
      description: Public endpoint, no authentication required.
      tags: [meta]
      operationId: getLimits
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Limits'
  /terms:
    get:
      summary: Get the Terms of Service
      description: >-
        Public endpoint, no authentication required. Returns the Terms of Service
        as a Markdown document (`text/markdown`).
      tags: [meta]
      operationId: getTerms
      security: []
      responses:
        '200':
          description: OK
          content:
            text/markdown:
              schema:
                type: string
  /privacy:
    get:
      summary: Get the Privacy Policy
      description: >-
        Public endpoint, no authentication required. Returns the Privacy Policy
        as a Markdown document (`text/markdown`).
      tags: [meta]
      operationId: getPrivacy
      security: []
      responses:
        '200':
          description: OK
          content:
            text/markdown:
              schema:
                type: string
  /files:
    post:
      summary: Upload a file
      description: >-
        Uploads a file and stores it as an immutable object in S3. The body must
        be non-empty and its `Content-Type` must be allowed by `files.whitelist`
        (`null` allows every type, an empty list allows none; otherwise only the
        listed patterns, where an exact `type/subtype` matches that type and a
        `<type>/*` entry such as `text/*` matches any subtype of that type). The
        default whitelist is `image/webp`, `image/gif`, `image/png`,
        `image/jpeg`, `image/jpg`, `text/*`. Supported raster
        types (WebP/GIF/PNG/JPEG) are re-encoded to WebP (container metadata is
        dropped) and stored with `Content-Type: image/webp`; the body of a
        re-encoded type must not exceed `media.files.max_input_bytes`, and a still
        JPEG is rotated to honor its EXIF orientation. All other whitelisted types
        are stored raw with the request `Content-Type`, and
        their metadata is preserved. The body must not exceed `files.max_size`.
        The object key is `files/{hash}` where `hash` is the hex SHA-256 of the
        final (possibly re-encoded) bytes, so re-uploading identical bytes reuses
        the existing file (no second upload). Stored objects are immutable and
        served with `Cache-Control: public, max-age=31536000, immutable` and
        `Content-Disposition: attachment` carrying the sanitized original name
        as `filename` (ASCII fallback) plus
        `filename*=UTF-8''<percent-encoded>` (RFC 6266/5987), so navigating to
        `public_url` saves the file under its original name. Embedded resources
        (`<img>`/`<video>`/`<audio src>`) ignore `Content-Disposition`, so inline
        rendering and playback are unaffected. The `hash` is `UNIQUE`, so an
        object always corresponds to a single `File` row and name. Responds with
        the file metadata and its hash. A file that no message ever references is
        deleted by the background GC once it is older than `files.gc.grace_s`
        (the row first, then the S3 object); uploaded-but-unattached files are
        therefore temporary. Responds `201 Created` when a new file row is
        inserted, or `200 OK` when the same bytes already exist and the row is
        reused.
      tags: [files]
      operationId: postFile
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: >-
            Original file name, within `api.files.max_name_codepoints`
            codepoints and valid under `format: display-name`.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: >-
          Any type allowed by `files.whitelist`; raster types are re-encoded to
          `image/webp`.
      responses:
        '200':
          description: OK (the same bytes already existed; the row was reused)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpload'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUpload'
        '400':
          description: >-
            Empty body, an invalid raster image, or a missing/invalid `name`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: >-
            Body exceeds `files.max_size`, or a re-encoded type exceeds
            `media.files.max_input_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Content-Type is not allowed by `files.whitelist`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: File storage is disabled (`files.type` is `none`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /gateway:
    get:
      summary: WebSocket gateway
      description: |
        Upgrade to WebSocket (Sec-WebSocket-Version: 13). Frame protocol (JSON):
        client sends `{"op":"identify","d":{"token":"<access token or bot_ token>"}}`
        (either a JWT access token or a static `bot_` bot token issued via
        PUT /system/users/{user_id}) and the server replies
        `{"op":"hello","d":{"heartbeat_interval":<ms>}}`;
        afterwards the client sends `{"op":"ack"}` every `heartbeat_interval` ms;
        the server sends dispatch events carrying a `seq`. The server closes the
        connection if no ack arrives within the threshold.
      tags: [gateway]
      operationId: getGateway
      security: []
      responses:
        '101':
          description: Switching Protocols
        '400':
          $ref: '#/components/responses/BadRequest'
  /auth/token:
    post:
      summary: Issue an access token (password grant)
      tags: [auth]
      operationId: postAuthToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, username, password]

              properties:
                grant_type:
                  type: string
                  enum: [password]
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: OK. Sets an HttpOnly `refresh_token` cookie (Path=/api).
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'refresh_token=...; Path=/api; Max-Age=...; HttpOnly; Secure; SameSite=Strict'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: Bad password or username
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/token/refresh:
    post:
      summary: Rotate the refresh token and issue a new access token
      description: Requires the `refresh_token` cookie. The old token is revoked and replaced.
      tags: [auth]
      operationId: postAuthTokenRefresh
      security:
        - refreshCookie: []
      responses:
        '200':
          description: OK. Sets a new `refresh_token` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'refresh_token=...; Path=/api; Max-Age=...; HttpOnly; Secure; SameSite=Strict'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: No `refresh_token` cookie (or unexpected request body)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Bad refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/token/logout:
    post:
      summary: Revoke the refresh token (logout)
      description: Requires the `refresh_token` cookie. Revokes the token and clears the cookie.
      tags: [auth]
      operationId: postAuthTokenLogout
      security:
        - refreshCookie: []
      responses:
        '200':
          description: OK. Clears the `refresh_token` cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'refresh_token=; Path=/api; Max-Age=0; HttpOnly; Secure; SameSite=Strict'
        '400':
          description: No `refresh_token` cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Bad, expired or unknown refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    get:
      summary: List users (keyset pagination)
      tags: [users]
      operationId: getUsers
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
          description: Default 50, max `api.users.max_users_limit` (see GET /limits)
        - name: after
          in: query
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWithId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/sync:
    get:
      summary: Changed users since a cursor
      tags: [sync]
      operationId: getUsersSync
      security:
        - bearerAuth: []
      description: >-
        Global changed-since delta for users. Returns only the ids of present
        rows whose `updated_at` is newer than `since` (upserts). Soft-deleted
        users stay present and are therefore listed; the client drops them after
        fetching one and observing `deleted_at`. Hard deletions are not listed.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersSync'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/@me:
    get:
      summary: Get the current user
      tags: [users]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithId'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update the current user
      tags: [users]
      operationId: patchMe
      security:
        - bearerAuth: []
      description: >-
        PATCH semantics: an absent field is unchanged; an explicit `null` clears
        the field (nullable fields only). Every PATCH (including a no-op with
        only `current_password`) requires `current_password`, verified against
        the stored hash; on a mismatch the server responds 401
        `"Bad password"`. Accounts without a password (bots, passwordless
        users) are rejected with 400 `"User has no password"`. A password
        change additionally requires the new `password` to differ from
        `current_password`. The `username` may be changed with the same
        validation as account creation; a taken username is rejected with 409
        `"Username is already used"`. Every successful update dispatches a
        `user_updated` gateway event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - current_password
              properties:
                username:
                  type: string
                  format: username
                  description: >-
                    New username. Same validation as account creation: min/max
                    `api.users.min/max_username_codepoints`, allowlist
                    `a-z`, `0-9`, `.`, `_` (first/last alphanumeric, no `..`),
                    reserved names rejected with 400 "'username' is reserved".
                    A username already in use is rejected with 409
                    "Username is already used". Not nullable: an explicit
                    `null` is a 400 "'username' is not a string".
                display_name:
                  type: string
                  format: display-name
                  nullable: true
                  description: >-
                    Min `api.users.min_display_name_codepoints`, max
                    `api.users.max_display_name_codepoints`; forbidden codepoints
                    (Cc/Cf, zero-width, BiDi, ...) are rejected with 400
                    "'display_name' is invalid".
                password:
                  type: string
                  description: >-
                    New password. Min/max per `auth.password`
                    (`min_password_codepoints` / `max_password_codepoints`,
                    additionally `max_password_len` in bytes). Requires
                    `current_password` and must differ from it. On success all
                    refresh tokens of the user are revoked except the one in the
                    `refresh_token` cookie when the cookie is sent, otherwise
                    every refresh token of the user is revoked; all of the
                    user's push subscriptions are removed in both cases, so the
                    client must re-register the current device.
                current_password:
                  type: string
                  description: >-
                    Current password. Required for every PATCH and verified
                    against the stored hash (mismatch → 401 "Bad password");
                    max `auth.password.max_password_len` in bytes.
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Username is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/@me/avatar:
    put:
      summary: Set the current user's avatar
      description: >-
        Set an avatar by uploading a static or animated image, within
        `media.avatar.max_dimensions`, `media.avatar.max_input_bytes` and the
        `media.avatar` animation caps. The `Content-Type` must be `image/webp`,
        `image/gif`, `image/png`, `image/jpeg` or `image/jpg`; unsupported types
        are rejected with `415`. Images are re-encoded to WebP (animations to
        animated WebP); a still JPEG is rotated to honor its EXIF orientation; the
        response contains the stored `avatar_hash` (XXHash64, 16 lowercase hex
        chars). The body must be non-empty.
        Use `DELETE` to clear the avatar; a PUT never clears it.
        Every successful change dispatches a `user_updated` gateway event.
      tags: [users]
      operationId: putMeAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: >-
          Raw image bytes. The request `Content-Type` must be `image/webp`,
          `image/gif`, `image/png`, `image/jpeg` or `image/jpg`; any other
          type is rejected with 415.
      responses:
        '200':
          description: Avatar stored
          content:
            application/json:
              schema:
                type: object
                required: [avatar_hash]
                properties:
                  avatar_hash:
                    type: string
                    pattern: '^[0-9a-f]{16}$'
        '400':
          description: >-
            The body is empty or not a decodable WebP/GIF/PNG/JPEG, or exceeds
            media.avatar.max_dimensions or the animation caps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body exceeds media.avatar.max_input_bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The content type is not image/webp, image/gif, image/png, image/jpeg or image/jpg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Clear the current user's avatar
      description: >-
        Removes the stored avatar. Idempotent: clearing an account that has no
        avatar is still 204. Dispatches a `user_updated` gateway event.
      tags: [users]
      operationId: deleteMeAvatar
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content (the avatar was cleared)
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/@me/userdata:
    get:
      summary: Get the current user's userdata
      tags: [users]
      operationId: getMeUserdata
      security:
        - bearerAuth: []
      description: >-
        Returns the stored opaque blob as
        `{"data": <arbitrary JSON value>, "updated_at": <epoch ms>}`. The server
        does not enforce any schema on `data`; it is whatever the client last
        stored. When nothing has been stored yet, both `data` and `updated_at`
        are `null` (never 404). `updated_at` is a non-negative Unix epoch in
        milliseconds, so a client can tell whether its local copy is stale.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, updated_at]
                properties:
                  data:
                    description: The stored arbitrary JSON value, or null.
                    nullable: true
                  updated_at:
                    type: integer
                    format: int64
                    nullable: true
                    minimum: 0
                    description: Unix epoch in milliseconds, or null.
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Replace the current user's userdata
      tags: [users]
      operationId: putMeUserdata
      security:
        - bearerAuth: []
      description: >-
        Stores `data` as the user's opaque blob, replacing any previous value
        (full replace, idempotent upsert). The body must be a valid JSON value
        of any kind (object, array, string, number, boolean or null) and must
        not exceed `api.users.max_userdata_bytes` (see `GET /limits`). No schema
        is enforced. Responds `200` with the new `updated_at`. No gateway event
        is dispatched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Any valid JSON value.
      responses:
        '200':
          description: Userdata stored
          content:
            application/json:
              schema:
                type: object
                required: [updated_at]
                properties:
                  updated_at:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Unix epoch in milliseconds.
        '400':
          description: >-
            The body is empty or is not valid JSON (400 "Bad JSON")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body exceeds api.users.max_userdata_bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /users/@me/guilds/{guild_id}/notifications:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: Get the current user's guild notification settings
      tags: [notifications]
      operationId: getMeGuildNotifications
      security:
        - bearerAuth: []
      description: >-
        Returns the caller's notification settings for the guild. These are
        personal settings: they are gated only by authentication, not by any
        guild permission. When the user has never changed them the defaults are
        returned (`level` = `all_messages`, `suppress_everyone` = false,
        `suppress_roles` = false, `push` = true), never 404. No gateway event is
        dispatched. The settings drive the notification fan-out: `level` decides
        whether the guild's messages produce a browser push (`all_messages`
        always, `only_mentions` only for a non-suppressed direct/role/`@everyone`
        mention, `nothing` never), the `suppress_*` flags gate the mention kinds
        only, and `push` disables pushes for the whole guild.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildNotificationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The guild does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update the current user's guild notification settings
      tags: [notifications]
      operationId: patchMeGuildNotifications
      security:
        - bearerAuth: []
      description: >-
        Partial update of the caller's notification settings for the guild. An
        absent field is unchanged; an explicit `null` is a type error (400). A
        body with no recognized field (e.g. `{}`) is 400 "Nothing to update",
        and unknown fields are ignored. On success responds `204 No Content`; no
        gateway event is dispatched (like `PUT /users/@me/userdata`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                  enum: [all_messages, only_mentions, nothing]
                suppress_everyone:
                  type: boolean
                suppress_roles:
                  type: boolean
                push:
                  type: boolean
      responses:
        '204':
          description: No Content (the settings were stored)
        '400':
          description: >-
            Empty body, non-object body, no recognized field, invalid level, or
            a field of the wrong type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The guild does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/@me/channels/{channel_id}/notifications:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      summary: Get the current user's channel notification settings
      tags: [notifications]
      operationId: getMeChannelNotifications
      security:
        - bearerAuth: []
      description: >-
        Returns the caller's notification settings for the channel (text channel
        or category). These are personal settings: they are gated only by
        authentication, not by any channel permission. When the user has never
        changed them the default `level` (`inherit`) is returned, never 404. An
        unknown channel is 404 "Channel not found". Alongside the stored `level`
        the response carries the resolved `effective_level`, following the
        inheritance chain channel -> parent category -> guild: `inherit` on a
        text channel falls back to its parent category's level (which may itself
        inherit from the guild), and a category (no parent) falls back to the
        guild. `effective_level` is never `inherit`. No gateway event is
        dispatched. The level drives the notification fan-out for the channel
        (`all_messages` always, `only_mentions` only for a non-suppressed
        mention, `nothing` never).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelNotificationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The channel does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Update the current user's channel notification settings
      tags: [notifications]
      operationId: patchMeChannelNotifications
      security:
        - bearerAuth: []
      description: >-
        Partial update of the caller's notification settings for the channel
        (text channel or category). An absent field is unchanged; an explicit
        `null` is a type error (400). A body with no recognized field (e.g.
        `{}`) is 400 "Nothing to update", and unknown fields are ignored. On
        success responds `204 No Content`; no gateway event is dispatched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                level:
                  type: string
                  enum: [inherit, all_messages, only_mentions, nothing]
      responses:
        '204':
          description: No Content (the settings were stored)
        '400':
          description: >-
            Empty body, non-object body, no recognized field, invalid level, or
            a field of the wrong type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The channel does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/@me/push-subscriptions:
    get:
      summary: List the current user's push subscriptions
      tags: [notifications]
      operationId: listMePushSubscriptions
      security:
        - bearerAuth: []
      description: >-
        Returns the caller's Web Push subscriptions as an array. The encryption
        secrets (`p256dh`, `auth`) are never returned. These are personal
        settings gated only by authentication.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PushSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Register a push subscription
      tags: [notifications]
      operationId: createMePushSubscription
      security:
        - bearerAuth: []
      description: >-
        Stores a browser `PushSubscription` (from `PushManager.subscribe`). An
        endpoint is globally unique — a browser profile is logged into one
        account at a time — so posting an endpoint another account registered
        takes it over (reassigns it to the caller); the previous account stops
        receiving on that device. Responds `201` when the caller did not own the
        endpoint before (a new endpoint or a takeover) and `200` with the object
        when the caller already owned it (re-posting refreshes its keys).
        `p256dh` must be a valid uncompressed P-256 point and `auth` 16 bytes.
        At most `api.push.max_subscriptions_per_user` are stored per user;
        re-posting an endpoint the caller already owns stays allowed at the cap,
        but taking over another account's endpoint is `400` at the cap. No
        gateway event is dispatched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushSubscriptionInput'
      responses:
        '201':
          description: >-
            The caller owns the endpoint now and did not before: a new endpoint
            or a takeover from another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscription'
        '200':
          description: The caller already owned the endpoint; its keys were refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscription'
        '400':
          description: >-
            Empty body, non-object body, missing/invalid field, invalid
            endpoint, P-256 key or auth secret, or the per-user cap reached
            (including a takeover attempted at the cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /users/@me/push-subscriptions/{subscription_id}:
    parameters:
      - $ref: '#/components/parameters/PushSubscriptionId'
    delete:
      summary: Delete a push subscription
      tags: [notifications]
      operationId: deleteMePushSubscription
      security:
        - bearerAuth: []
      description: >-
        Removes one of the caller's subscriptions. An unknown or foreign id
        answers 404. On success responds `204 No Content`.
      responses:
        '204':
          description: No Content
        '400':
          description: The path id is not a decimal snowflake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The subscription does not exist or belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{user_id}/avatar:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      summary: Get a user's avatar image
      description: >-
        Public endpoint, no authentication required. Streams the stored webp
        (or animated webp) avatar. The `hash` query parameter is required and
        must equal the user's current `avatar_hash`, otherwise 404. The response
        is immutable for a given hash, so it is safe to cache.
      tags: [users]
      operationId: getUserAvatar
      security: []
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Avatar not found (unknown user, no avatar, or hash mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      summary: Get a user
      tags: [users]
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
