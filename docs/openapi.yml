          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /channels/{channel_id}/pins/{message_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/MessageId'
    put:
      summary: Pin a message (read_messages and add_pins required)
      description: >-
        Idempotent. The message must exist in the path channel and not be
        deleted. A real `false -> true` transition dispatches a
        `message_pinned` gateway event.
      tags: [messages]
      operationId: pinMessage
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '400':
          description: Malformed channel_id or message_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages and add_pins required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel not found; or message not found in the channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Unpin a message (read_messages and delete_pins required)
      description: >-
        Idempotent. The message must exist in the path channel and not be
        deleted. A real `true -> false` transition dispatches a
        `message_unpinned` gateway event.
      tags: [messages]
      operationId: unpinMessage
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '400':
          description: Malformed channel_id or message_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages and delete_pins required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel not found; or message not found in the channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /messages/{message_id}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      summary: Get a message (read_messages on the message's channel required)
      tags: [messages]
      operationId: getMessage
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageWithoutId'
        '400':
          description: Malformed message_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Edit a message (author only; read_messages required)
      description: >-
        The caller must have `read_messages` on the message's channel and be
        the author of the message.
        `content` follows the same rules as POST /channels/{channel_id}/messages.
        An optional `embeds` replaces the message's embeds: absent leaves them
        unchanged, an explicit `null` or an empty array clears them, and a
        non-empty array is validated exactly like POST.
        Attachments are always derived from `content` and replace the message's
        attachment set: every `attachment://<file_id>` reference in the new
        content is a file id (deduplicated, first-appearance order), at most
        `api.messages.max_attachments` unique ids, each of which must exist. An
        edit that drops a reference also drops the file association (letting the
        GC collect it).
        Mentions (`mention_everyone`, `mentions`, `mention_roles`) are always
        recomputed from the new `content`; `allowed_mentions` is not accepted on
        edit because edits never notify.
        Returns the updated message object (the same shape as `GET`).
      tags: [messages]
      operationId: editMessage
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: message-body
                embeds:
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/Embed'
                  description: >-
                    Replaces the message's embeds. `null` or `[]` clears them;
                    absent leaves them unchanged; at most
                    `api.messages.max_embeds` are accepted.
            example:
              content: Edited message
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: >-
            Bad JSON, content missing/not a string/empty/too long (max
            `api.messages.max_codepoints_per_message` after stripping), an
            invalid UTF-8, an invalid embed, or a content attachment reference
            that does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages required) or the caller is not the author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a message (read_messages required; author, or a strictly higher moderator with delete_messages)
      description: >-
        The caller must have `read_messages` on the message's channel. The
        author may then delete the own message without any further permissions.
        A non-author also needs delete_messages on the message's channel and
        must be strictly higher in the role hierarchy than the author. Deletion
        is a soft delete: content is wiped and the message becomes anonymous.
      tags: [messages]
      operationId: deleteMessage
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '400':
          description: Malformed message_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages required; non-author without delete_messages or not strictly higher than the author)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /messages/{message_id}/reactions:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    put:
      summary: Add your own reaction (read_messages and add_reactions required, idempotent)
      description: >-
        Adds the caller's reaction. Re-adding the same emoji is idempotent
        (still 204). A custom `emoji_id` must belong to the message's guild.
        `unicode_emoji` must be exactly one emoji sequence in any qualification
        form (fully-qualified, minimally-qualified or unqualified) or one
        regional indicator symbol; it is stored in its canonical
        fully-qualified form, so every form of one emoji is a single reaction.
        A new distinct emoji is rejected once the message already holds
        `api.messages.max_reactions` distinct emoji.
      tags: [messages]
      operationId: putMessageReaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactionRequest'
            example:
              unicode_emoji: "\U0001F44D"
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad JSON, not an object, neither/both `emoji_id` and
            `unicode_emoji`, a non-string target, an unknown/invalid custom
            emoji (wrong guild) or an invalid unicode sequence, or the
            message already holds `api.messages.max_reactions` distinct emoji
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages and add_reactions required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: >-
        Remove a reaction (read_messages required; another user's also requires
        delete_reactions and a strictly higher role)
      description: >-
        The caller must have `read_messages` on the message's channel.
        Removes the caller's reaction with the given emoji; with no emoji
        parameter, removes all of the caller's reactions on the message.
        With `user_id`, removes that user's reaction instead, which additionally
        requires `delete_reactions` on the channel and being strictly higher in
        the role hierarchy than the target. Idempotent (a missing reaction is
        still 204).
      tags: [messages]
      operationId: deleteMessageReaction
      security:
        - bearerAuth: []
      parameters:
        - name: emoji_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          description: >-
            Custom emoji id; must belong to the message's guild. Mutually
            exclusive with `unicode_emoji`.
        - name: unicode_emoji
          in: query
          required: false
          schema:
            type: string
          description: >-
            One emoji sequence in any qualification form (fully-qualified,
            minimally-qualified or unqualified) or a regional indicator symbol,
            percent-encoded. Canonicalized to the fully-qualified form before
            matching.
            Mutually exclusive with `emoji_id`.
        - name: user_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          description: >-
            Remove this user's reaction instead of the caller's; requires
            delete_reactions and being strictly higher than the target.
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Malformed message_id, unknown parameter, both emoji parameters,
            invalid `emoji_id` / `unicode_emoji` / `user_id`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            Missing permissions (read_messages required; removing another
            user's reaction also requires delete_reactions and being strictly
            higher than the target)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /messages/{message_id}/reactions/users:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      summary: List the users who reacted with one emoji (read_messages required)
      description: >-
        Returns the ids of the users who reacted to the message with exactly the
        requested emoji, ascending by user id. Soft-deleted users are excluded,
        so the array length matches the corresponding `count` of
        `GET /messages/{message_id}/reactions`. Returns an empty array (not 404)
        when nobody reacted with that emoji.
      tags: [messages]
      operationId: getMessageReactionUsers
      security:
        - bearerAuth: []
      parameters:
        - name: emoji_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          description: >-
            Custom emoji id; must belong to the message's guild. Mutually
            exclusive with `unicode_emoji`; exactly one is required.
        - name: unicode_emoji
          in: query
          required: false
          schema:
            type: string
          description: >-
            One emoji sequence in any qualification form (fully-qualified,
            minimally-qualified or unqualified) or a regional indicator symbol,
            percent-encoded. Canonicalized to the fully-qualified form before
            matching.
            Mutually exclusive with `emoji_id`; exactly one is required.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: >-
            Default 50; must be > 0 and
            <= `api.messages.max_reactions_users_limit` (see GET /limits).
        - name: after
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          description: Keyset cursor; return users with a strictly greater id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Id'
        '400':
          description: >-
            Malformed message_id, unknown parameter, neither/both emoji
            parameters, invalid `emoji_id` / `unicode_emoji` / `after`, or a
            `limit` outside 1..100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (read_messages required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Message not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /channels/{channel_id}/overwrites:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    put:
      summary: Create or update a channel permission overwrite (upsert)
      tags: [channels]
      operationId: putOverwrite
      description: >-
        Upserts an overwrite for a role or member on the channel. Setting
        both `allow` and `deny` to `"0"` removes the overwrite. Requires
        `manage_overwrites` computed on the channel. Every bit flipped by
        the request (XOR of the old/new `allow` and old/new `deny`; all set
        `allow|deny` bits when creating) must be present in the caller's
        channel permissions. Target hierarchy: a member target must be
        strictly below the caller's highest role position (self-overwrites
        are always allowed, even with no roles), a role target's position
        must be strictly below the caller's highest role position.
        An identical `allow`/`deny` pair is an idempotent no-op (204) and
        bypasses the hierarchy checks.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, type, allow, deny]
              properties:
                target_id:
                  $ref: '#/components/schemas/Id'
                type:
                  type: string
                  enum: [role, member]
                allow:
                  $ref: '#/components/schemas/PermissionBits'
                deny:
                  $ref: '#/components/schemas/PermissionBits'
      responses:
        '204':
          description: Overwrite applied (created, updated, or removed)
        '400':
          description: Bad JSON, malformed channel_id, or body validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing `manage_overwrites`, a changed bit is not owned by the caller, or a hierarchy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Channel, role, or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/{webhook_id}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      summary: Get a webhook
      description: >-
        Returns the webhook by id. Soft-deleted rows are still returned (with
        `deleted_at` set) so messages posted by a deleted webhook keep rendering
        name/avatar; management endpoints instead treat a deleted webhook as
        404. Readable by any authenticated user (metadata is not
        permission-gated).
      tags: [webhooks]
      operationId: getWebhook
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
        '400':
          description: Malformed webhook_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      summary: Rename a webhook (modify_webhooks required)
      description: >-
        Renames the webhook. An absent `name` is a no-op that still succeeds. A
        soft-deleted webhook is 404. On success the endpoint returns
        `204 No Content` (there is no server-derived field to return) and
        dispatches a `webhook_updated` gateway event.
      tags: [webhooks]
      operationId: patchWebhook
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  format: display-name
                  description: >-
                    Optional new name. Absent leaves the current name unchanged;
                    when present it is validated like create.
      responses:
        '204':
          description: No Content
        '400':
          description: >-
            Bad JSON, "'name' is not a string"/"'name' is too long"/"'name' is
            invalid"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (modify_webhooks required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      summary: Delete a webhook (delete_webhooks required)
      description: >-
        Soft-deletes the webhook (`deleted_at`). A soft-deleted webhook is 404,
        so deleting twice returns 404 the second time. The row survives for
        message attribution. Dispatches a `webhook_deleted` gateway event.
      tags: [webhooks]
      operationId: deleteWebhook
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '400':
          description: Malformed webhook_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (delete_webhooks required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/{webhook_id}/avatar:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      summary: Get a webhook's avatar image
      description: >-
        Public endpoint, no authentication required. Streams the stored webp
        (or animated webp) avatar. The `hash` query parameter is required and
        must equal the webhook's current `avatar_hash`, otherwise 404. Unlike
        the management endpoints, a soft-deleted webhook is still served (like
        `GET /api/webhooks/{webhook_id}`) so its messages keep rendering. The
        response is immutable for a given hash, so it is safe to cache.
      tags: [webhooks]
      operationId: getWebhookAvatar
      security: []
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Avatar not found (unknown webhook, no avatar, or hash mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Set a webhook avatar (modify_webhooks required)
      description: >-
        Uploads a raw image body and stores the re-encoded WebP avatar. The body
        must be non-empty with a supported raster `Content-Type` (`image/webp`,
        `image/gif`, `image/png`, `image/jpeg`, `image/jpg`); otherwise
        `400 "Bad image"` / `415`. An
        unsupported/empty body is rejected before any encoding. A body over
        `media.avatar.max_input_bytes` is 413 "Image is too large"; an image that
        is not a valid WebP/GIF/PNG/JPEG within the `media.avatar` dimension and
        animation caps is 400 "Bad image". A still JPEG is rotated to honor its
        EXIF orientation. A soft-deleted webhook is 404.
        Dispatches a `webhook_updated` gateway event.
      tags: [webhooks]
      operationId: putWebhookAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: >-
          Raw image bytes. The request `Content-Type` must be `image/webp`,
          `image/gif`, `image/png`, `image/jpeg` or `image/jpg`; any other
          type is rejected with 415.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [avatar_hash]
                properties:
                  avatar_hash:
                    type: string
                    pattern: '^[0-9a-f]{16}$'
        '400':
          description: Empty or malformed image ("Bad image")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (modify_webhooks required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Image is too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      summary: Clear a webhook avatar (modify_webhooks required)
      description: >-
        Clears the avatar; idempotent (a webhook without an avatar still returns
        204). A soft-deleted webhook is 404. Dispatches a `webhook_updated`
        gateway event.
      tags: [webhooks]
      operationId: deleteWebhookAvatar
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content
        '400':
          description: Malformed webhook_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (modify_webhooks required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /webhooks/{webhook_id}/{token}:
    post:
      summary: Execute a webhook (token-authenticated, no session)
      description: >-
        Posts a message into the webhook's channel as the webhook. The token is
        the capability: there is no session, no bearer auth, and no channel
        permission check (mirroring `POST /channels/{channel_id}/messages`).
        The webhook must exist, not be soft-deleted and `token` must hash to its
        stored `token_hash`; anything else is 404. The body is validated exactly
        like `POST /channels/{channel_id}/messages` (`content`, `reply_to_id`,
        `embeds`, `mentions`, `allowed_mentions`, and attachments derived from
        `content`); the stored message has `author_id` null and `webhook_id` set.
        A `message_created` gateway event and push notifications are emitted like
        a user message; the push payload carries the author's `author_id` (null
        for a webhook), `author_name`, `author_avatar_hash` and `webhook_id` so
        the client can render the author without an extra lookup. Returns the
        created message object.
      tags: [webhooks]
      operationId: executeWebhook
      security: []
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Plaintext execute token from webhook creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  format: message-body
                reply_to_id:
                  allOf:
                    - $ref: '#/components/schemas/Id'
                  nullable: true
                embeds:
                  type: array
                  nullable: true
                  items:
                    $ref: '#/components/schemas/Embed'
                allowed_mentions:
                  allOf:
                    - $ref: '#/components/schemas/AllowedMentions'
                  nullable: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: >-
            Bad JSON, content missing/not a string/empty/too long, invalid
            reply target, invalid embed/mention, a missing attachment reference,
            or an empty body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook not found (unknown, soft-deleted, or bad token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /webhooks/{webhook_id}/{token}/github:
    post:
      summary: Execute a GitHub-compatible webhook (token-authenticated, no session)
      description: >-
        GitHub integration endpoint. Configure this URL as
        the "Payload URL" of a repository/organization webhook on GitHub. The
        `X-GitHub-Event` header selects the event; the JSON (or
        `application/x-www-form-urlencoded` `payload=`) body is rendered into a
        single rich embed and posted into the webhook's channel as the webhook
        (attribution uses the webhook's configured `name`/avatar). No signature verification
        (`X-Hub-Signature*` is ignored) and no delivery deduplication: the URL
        token is the capability, exactly like `POST /webhooks/{webhook_id}/{token}`.
        Supported event/action combinations are `commit_comment/created`,
        `create` (branch/tag), `delete` (branch/tag), `fork`,
        `issue_comment/created`, `issues` (opened/closed/reopened), `member/added`,
        `public`, `pull_request` (opened/closed/reopened),
        `pull_request_review/submitted`,
        `pull_request_review_comment/created`, `push`, `release/published`,
        `watch/started`, `star` (created/deleted), `check_run/completed`,
        `check_suite/completed`, `discussion/created`,
        `discussion_comment/created`, and `repository/created`. For a supported
        combination with a valid payload, the endpoint creates one message.
        For an unsupported event, unsupported action, or incomplete payload, it
        creates no message and still responds with `204 No Content`. GitHub's
        `ping` event is a setup verification delivery; it is acknowledged with
        `204 No Content` and does not create a chat message. Deliveries are not
        deduplicated, so a redelivery can create another message.
      tags: [webhooks]
      operationId: executeGitHubWebhook
      security: []
      parameters:
        - name: webhook_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Plaintext execute token from webhook creation.
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: GitHub event name (e.g. `push`, `issues`).
      requestBody:
        required: true
        description: >-
          The raw GitHub webhook payload (`application/json`, or
          `application/x-www-form-urlencoded` with a `payload` field).
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payload:
                  type: string
      responses:
        '204':
          description: >-
            The delivery was accepted. A chat message is created only for a
            supported event/action combination with a valid payload; otherwise
            no message is created. This includes GitHub's setup-verification
            `ping` event.
        '400':
          description: Missing `X-GitHub-Event`, empty body, or bad JSON payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Webhook not found (unknown, soft-deleted, or bad token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request body larger than `api.github.max_body_bytes`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /system/users:
    post:
      summary: Create a user (passwordless when password omitted; bots must not have a password)
      tags: [system]
      operationId: postSystemUser
      security:
        - systemToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                id:
                  allOf:
                    - $ref: '#/components/schemas/Id'
                  description: Optional custom snowflake
                username:
                  type: string
                  format: username
                  description: >-
                    Allowlist `a-z`, `0-9`, `.`, `_`; the first and the last
                    characters must be alphanumeric; `..` is forbidden; max
                    `api.users.max_username_codepoints`, min
                    `api.users.min_username_codepoints`; reserved names are
                    rejected.
                password:
                  type: string
                  description: Forbidden for bots
                is_bot:
                  type: boolean
                display_name:
                  type: string
                  format: display-name
                  description: Max `api.users.max_display_name_codepoints`
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      summary: Edit a user
      description: >-
        Edits `username`, `display_name` and `password`. Absent fields are left
        unchanged; explicit `null` clears `display_name` or `password` (making
        the account passwordless). `username` cannot be cleared. A password is
        forbidden for bot accounts. Setting or clearing a password revokes all
        refresh tokens of the user and removes all of the user's push
        subscriptions. Avatars are managed by
        `PUT /users/@me/avatar`.
      tags: [system]
      operationId: patchSystemUser
      security:
        - systemToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  format: username
                  description: >-
                    Allowlist `a-z`, `0-9`, `.`, `_`; the first and the last
                    characters must be alphanumeric; `..` is forbidden; max
                    `api.users.max_username_codepoints`, min
                    `api.users.min_username_codepoints`; reserved names are
                    rejected.
                display_name:
                  type: string
                  nullable: true
                  format: display-name
                  description: >-
                    Min `api.users.min_display_name_codepoints`, max
                    `api.users.max_display_name_codepoints`.
                password:
                  type: string
                  nullable: true
                  description: >-
                    Min `auth.password.min_password_codepoints`, max
                    `auth.password.max_password_codepoints` codepoints and
                    `auth.password.max_password_len` bytes; forbidden for bots.
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Username is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Issue (or rotate) the static bot token of a user
      description: >-
        Only bot accounts (`is_bot`) carry a static token. Exactly one token
        exists per bot: re-issuing revokes the previous token. The plaintext
        token is returned once; the server stores only its SHA-256 hash. Bot
        tokens have no expiry and are accepted by `bearerAuth` and the gateway
        `identify`.
      tags: [system]
      operationId: putSystemUserBotToken
      security:
        - systemToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    pattern: '^bot_[A-Za-z0-9_-]{43}$'
                    description: Static bot token (base64url of 32 random bytes)
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found (or already deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User is not a bot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Soft-delete a user
      tags: [system]
      operationId: deleteSystemUser
      security:
        - systemToken: []
      responses:
        '204':
          description: No Content
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/guilds:
    post:
      summary: Create a guild
      tags: [system]
      operationId: postSystemGuild
      security:
        - systemToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id:
                  allOf:
                    - $ref: '#/components/schemas/Id'
                  description: Optional custom snowflake
                name:
                  type: string
                  format: display-name
                  description: Max `api.guilds.max_name_codepoints`
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /system/guilds/{guild_id}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    delete:
      summary: Delete a guild
      tags: [system]
      operationId: deleteSystemGuild
      security:
        - systemToken: []
      responses:
        '204':
          description: No Content
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/guilds/{guild_id}/roles/{role_id}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
      - $ref: '#/components/parameters/RoleId'
    delete:
      summary: Delete a role
      description: The @everyone role (role_id = guild_id) cannot be deleted.
      tags: [system]
      operationId: deleteSystemRole
      security:
        - systemToken: []
      responses:
        '204':
          description: No Content
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cannot delete the @everyone role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
  /system/superuser:
    post:
      summary: Create a superuser role and assign it to a user
      tags: [system]
      operationId: postSystemSuperuser
      security:
        - systemToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guild_id, user_id]
              properties:
                guild_id:
                  $ref: '#/components/schemas/Id'
                user_id:
                  $ref: '#/components/schemas/Id'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    $ref: '#/components/schemas/Id'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          description: Bad system token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT access token from POST /auth/token. Also accepts static `bot_`
        bot tokens issued via PUT /system/users/{user_id} (no expiry; revoked
        when re-issued or when the bot is deleted).
    systemToken:
      type: http
      scheme: bearer
      description: Static system token from the server config (`auth.system_token`).
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly `refresh_token` cookie issued by POST /auth/token (Path=/api).
  parameters:
    GuildId:
      name: guild_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ChannelId:
      name: channel_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleId:
      name: role_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    EmojiId:
      name: emoji_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PushSubscriptionId:
      name: subscription_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    WebhookId:
      name: webhook_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Since:
      name: since
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: >-
        Epoch milliseconds high-water mark. Omitted defaults to the start of the
        lookback window (`sync.max_lookback_s` of GET /limits). A value older
        than that window is rejected with 400 "'since' is too old"; a
        non-numeric, negative, or implausibly future value is 400 "'since' is
        invalid". The response's `updated_at` is the cursor to pass next.
  responses:
    BadRequest:
      description: Bad request (invalid JSON, validation failure, or unknown resource reported as 400 by some GET endpoints)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, malformed or expired bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Missing permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The Content-Type is not application/json (or not a supported image type)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MethodNotAllowed:
      description: >-
        The method is not allowed for this path; the `Allow` header lists the
        accepted methods
      headers:
        Allow:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Id:
      type: string
      pattern: '^[0-9]+$'
      description: Decimal string of a 64-bit snowflake ID (JS BigInt compatible)
    GuildNotificationSettings:
      type: object
      required: [level, suppress_everyone, suppress_roles, push]
      description: The caller's notification settings for a guild.
      properties:
        level:
          type: string
          enum: [all_messages, only_mentions, nothing]
          description: >-
            Default `all_messages`. `only_mentions` notifies only on mentions;
            `nothing` suppresses all notifications for the guild.
        suppress_everyone:
          type: boolean
          description: Ignore @everyone and @here. Default false.
        suppress_roles:
          type: boolean
          description: Do not notify on role mentions. Default false.
        push:
          type: boolean
          description: >-
            Whether the guild may produce browser push notifications. Default true.
    ChannelNotificationSettings:
      type: object
      required: [level, effective_level]
      description: The caller's notification settings for a text channel or category.
      properties:
        level:
          type: string
          enum: [inherit, all_messages, only_mentions, nothing]
          description: >-
            The stored level. Default `inherit`: fall back to the parent
            category (text channels) and then the guild. `nothing` suppresses
            notifications for the channel regardless of the guild.
        effective_level:
          type: string
          enum: [all_messages, only_mentions, nothing]
          description: >-
            The fully resolved level (never `inherit`), following the chain
            channel -> parent category -> guild. Lets a client render the
            "use default" option's current value without extra requests.
    PushSubscription:
      type: object
      required: [id, endpoint, created_at]
      description: >-
        A stored browser push subscription (secrets omitted). An endpoint is
        globally unique: it belongs to exactly one account (the one currently
        logged in in that browser profile).
      properties:
        id:
          $ref: '#/components/schemas/Id'
        endpoint:
          type: string
          description: The push service URL from `PushSubscription.endpoint`.
        created_at:
          type: integer
          description: Unix epoch in milliseconds.
    PushSubscriptionInput:
      type: object
      required: [endpoint, p256dh, auth]
      description: >-
        A browser `PushSubscription` to register. Registering an endpoint
        already owned by another account takes it over (moves it to the
        caller).
      properties:
        endpoint:
          type: string
          format: uri
          description: >-
            Absolute `http(s)` push service URL, within
            `api.push.max_endpoint_bytes` bytes. Stored verbatim (never
            normalized).
        p256dh:
          type: string
          description: >-
            base64url (no padding) of the subscription's uncompressed P-256
            public key (65 bytes; `PushSubscription.getKey('p256dh')`).
        auth:
          type: string
          description: >-
            base64url (no padding) of the 16-byte authentication secret
            (`PushSubscription.getKey('auth')`).
    Webhook:
      type: object
      required: [id, guild_id, channel_id, name, avatar_hash, created_at, deleted_at]
      description: >-
        A per-channel webhook. It carries no owner: management is gated purely
        by the channel's `create_webhooks` / `modify_webhooks` /
        `delete_webhooks` permissions. The execute token is never included.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        guild_id:
          $ref: '#/components/schemas/Id'
        channel_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          format: display-name
          description: >-
            Max `api.webhooks.max_name_codepoints`; forbidden codepoints are
            rejected with 400 "'name' is invalid".
        avatar_hash:
          type: string
          nullable: true
          description: >-
            Hex XXHash64 of the stored WebP avatar (16 lowercase hex chars);
            null when unset.
        created_at:
          type: integer
          format: int64
          description: Unix epoch, milliseconds.
        deleted_at:
          type: integer
          format: int64
          nullable: true
          description: >-
            Set when the webhook is soft-deleted. A deleted webhook is gone for
            management/execute (404) but still returned by
            `GET /api/webhooks/{webhook_id}` so its messages keep rendering
            name/avatar.
    WebhookInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          format: display-name
          description: >-
            Webhook name, within `api.webhooks.max_name_codepoints` codepoints
            and passing the `.name` profile. On PATCH the field is optional: an
            absent `name` leaves the current one.
    WebhookToken:
      type: object
      required: [id, token]
      description: >-
        The create-only response of `POST /api/channels/{channel_id}/webhooks`.
        The plaintext `token` is shown exactly once and never returned again
        (list/get never include it); only its sha256 is stored.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        token:
          type: string
          description: >-
            base64url (no padding) execute token. Present it in the path of
            `POST /api/webhooks/{webhook_id}/{token}`.
    File:
      type: object
      required: [id, name, size, content_type, hash, public_url]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          format: display-name
          description: >-
            Original file name, within `api.files.max_name_codepoints`
            codepoints.
        size:
          type: integer
          format: int64
          description: Size of the stored object in bytes.
        content_type:
          type: string
          description: >-
            MIME type of the stored object; always `image/webp` for re-encoded
            raster uploads (WebP/GIF/PNG/JPEG), otherwise the request
            `Content-Type`.
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Hex SHA-256 of the bytes and the object key suffix
            (`files/{hash}`).
        public_url:
          type: string
          nullable: true
          description: >-
            `{files.s3.public_base_url}/files/{hash}`; null when storage is
            disabled. Not access-controlled: anyone with the URL can fetch the
            object. The object carries a `Content-Disposition` with the
            sanitized original `name`, so navigating to this URL downloads the
            file under its original name.
    Attachment:
      allOf:
        - $ref: '#/components/schemas/File'
        - type: object
          description: >-
            A file attached to a message, returned inline in message reads. The
            `public_url` may be refreshed independently of the message.
    FileUpload:
      $ref: '#/components/schemas/File'
    PermissionBits:
      type: string
      pattern: '^[0-9]+$'
      description: 128-bit permission mask as decimal string
    AuditLogEntry:
      type: object
      description: >-
        One audit-log entry. `target_id`, `target_user_id` and `channel_id`
        identify the target of the action and may be null depending on
        `action`: channel actions carry `channel_id`, role/emoji/webhook/message
        actions carry `target_id` (with `channel_id` for webhooks/messages),
        `role_overwrite_update` carries `channel_id` plus `target_id` (role) and
        `member_overwrite_update` carries `channel_id` plus `target_user_id`
        (member), role grant/revoke carry `target_id` (role) and
        `target_user_id` (member), and guild actions and the reorder actions
        carry neither.
      required: [id, actor_id, action, target_id, target_user_id, channel_id, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        actor_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        action:
          type: string
          enum:
            - guild_name_update
            - guild_avatar_update
            - guild_avatar_delete
            - channel_create
            - channel_name_update
            - channel_topic_update
            - channel_parent_update
            - channel_delete
            - channel_reorder
            - role_overwrite_update
            - member_overwrite_update
            - role_create
            - role_name_update
            - role_permissions_update
            - role_color_update
            - role_mentionable_update
            - role_delete
            - role_reorder
            - role_grant
            - role_revoke
            - emoji_create
            - emoji_name_update
            - emoji_icon_update
            - emoji_delete
            - webhook_create
            - webhook_name_update
            - webhook_avatar_update
            - webhook_avatar_delete
            - webhook_delete
            - message_delete
            - message_pin
            - message_unpin
        target_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        target_user_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        channel_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        created_at:
          type: integer
          description: Unix epoch milliseconds.
    AllowedMentions:
      type: object
      description: >-
        Controls which mentions parsed from the message content take effect. It
        is validated against the presence of mentions in `content` (phantom ids
        are silently ignored) and never rewrites the content. `parse` is
        mutually exclusive with `users`/`roles`.
      properties:
        parse:
          type: array
          items:
            type: string
            enum: [users, roles, everyone]
          description: >-
            Mention kinds to parse; an empty array suppresses every mention.
            Mutually exclusive with `users`/`roles`.
        users:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: >-
            User ids allowed to be mentioned; at most
            `api.messages.max_allowed_mention_users`. Disables all other kinds.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: >-
            Role ids allowed to be mentioned; at most
            `api.messages.max_allowed_mention_roles`. Disables all other kinds.
    TokenResponse:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Access token lifetime, seconds
    User:
      type: object
      required: [username, display_name, avatar_hash, is_bot]
      properties:
        username:
          type: string
          format: username
        display_name:
          type: string
          format: display-name
          nullable: true
        avatar_hash:
          type: string
          pattern: '^[0-9a-f]{16}$'
          nullable: true
          readOnly: true
          description: >-
            XXHash64 of the stored webp avatar, 16 lowercase hex chars; null
            when the user has no avatar. Fetch the image from
            `GET /users/{user_id}/avatar?hash={avatar_hash}`.
        is_bot:
          type: boolean
    UserWithId:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [id]
          properties:
            id:
              $ref: '#/components/schemas/Id'
    Guild:
      type: object
      required: [id, name, avatar_hash]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          format: display-name
        avatar_hash:
          type: string
          pattern: '^[0-9a-f]{16}$'
          nullable: true
          readOnly: true
          description: >-
            XXHash64 of the stored webp avatar, 16 lowercase hex chars; null
            when the guild has no avatar. Fetch the image from
            `GET /guilds/{guild_id}/avatar?hash={avatar_hash}`.
    Emoji:
      type: object
      required: [id, name, icon_hash]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          format: emoji-name
          description: Unique within the guild.
        icon_hash:
          type: string
          pattern: '^[0-9a-f]{16}$'
          readOnly: true
          description: >-
            XXHash64 of the stored webp icon, 16 lowercase hex chars. Fetch the
            image from `GET /emojis/{emoji_id}/icon?hash={icon_hash}`.
    ReactionRequest:
      type: object
      description: >-
        Exactly one of `emoji_id` / `unicode_emoji` must be present; the emoji
        is identified by the two columns of `app.message_reactions`.
      properties:
        emoji_id:
          $ref: '#/components/schemas/Id'
        unicode_emoji:
          type: string
          description: >-
            Exactly one emoji sequence in any qualification form (fully-qualified,
            minimally-qualified or unqualified) or a regional indicator symbol
            (raw UTF-8, not percent-encoded). Stored in its canonical
            fully-qualified form.
    ReactionSummary:
      type: object
      required: [emoji_id, unicode_emoji, count, me]
      description: >-
        Exactly one of `emoji_id` / `unicode_emoji` is set; `count` is the
        number of non-deleted users who reacted with that emoji (equal to the
        length of `GET /messages/{message_id}/reactions/users` for it) and `me`
        is whether the caller did.
      properties:
        emoji_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        unicode_emoji:
          type: string
          nullable: true
        count:
          type: integer
          format: int64
        me:
          type: boolean
    ChannelKind:
      type: string
      enum: [channel, category]
    Channel:
      type: object
      required: [id, parent_id, kind, name, topic, position, last_message_id, permissions, overwrites]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        parent_id:
          type: string
          pattern: '^[0-9]+$'
          nullable: true
        kind:
          $ref: '#/components/schemas/ChannelKind'
        name:
          type: string
          format: display-name
        topic:
          type: string
          format: display-name
          nullable: true
        position:
          type: integer
          minimum: 0
          maximum: 32767
          description: >-
            Read-only ordering within the channel's parent scope; change it
            through PUT /guilds/{guild_id}/channels/order
        last_message_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: >-
            The id of the newest non-deleted message in the channel, or null
            when the channel has no non-deleted messages.
        permissions:
          allOf:
            - $ref: '#/components/schemas/PermissionBits'
          description: >-
            Read-only effective permissions of the requesting user on this
            channel: the guild base permissions folded with the channel
            overwrites (`@everyone` → the user's roles → the member overwrite),
            honoring the caller's `skip_denies`/`skip_allows`. The value is the
            exact mask the channel permission checks evaluate, so it includes
            guild-level bits (`create_channels`, `create_roles`, ...) and the
            skip bits. Returned by both GET /guilds/{guild_id}/channels and
            GET /channels/{channel_id}.
        overwrites:
          type: array
          items:
            $ref: '#/components/schemas/Overwrite'
          description: >-
            Full permission-overwrite list of the channel, ordered by target
            type then target id. An empty array when the channel has none.
            Readable by any authenticated user. Mutation is still through
            PUT /channels/{channel_id}/overwrites.
    ChannelWithGuild:
      allOf:
        - $ref: '#/components/schemas/Channel'
        - type: object
          required: [guild_id]
          properties:
            guild_id:
              $ref: '#/components/schemas/Id'
    EmbedField:
      type: object
      required: [name, value]
      description: >-
        A single embed field. `name` and `value` are required and follow the
        message-text profile (NFKC-normalized, forbidden codepoints stripped)
        bounded by `api.embeds.max_field_name_codepoints` and
        `api.embeds.max_field_value_codepoints`.
      properties:
        name:
          type: string
        value:
          type: string
        inline:
          type: boolean
          default: false
    EmbedFooter:
      type: object
      required: [text]
      properties:
        text:
          type: string
        icon_url:
          type: string
          nullable: true
    EmbedImage:
      type: object
      required: [url]
      properties:
        url:
          type: string
    EmbedThumbnail:
      type: object
      required: [url]
      properties:
        url:
          type: string
    EmbedVideo:
      type: object
      required: [url]
      properties:
        url:
          type: string
    EmbedAuthor:
      type: object
      required: [name]
      properties:
        name:
          type: string
        url:
          type: string
          nullable: true
        icon_url:
          type: string
          nullable: true
    Embed:
      type: object
      description: >-
        A rich embed. Validation is strict: when a sub-object is present its
        required fields (`footer.text`, `author.name`,
        `image`/`thumbnail`/`video.url`, `field.name`/`field.value`) must be
        present too. Text fields are NFKC-normalized and message-text forbidden
        codepoints are stripped; URLs are bounded by
        `api.embeds.max_url_codepoints` and do not count towards
        `api.embeds.max_total_codepoints`. At most `api.messages.max_embeds`
        embeds are accepted per message.
      properties:
        type:
          type: string
          enum: [rich]
          default: rich
        title:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        timestamp:
          type: integer
          format: int64
          nullable: true
          description: Unix epoch, milliseconds
        color:
          type: integer
          minimum: 0
          maximum: 16777215
          nullable: true
        footer:
          allOf:
            - $ref: '#/components/schemas/EmbedFooter'
          nullable: true
        image:
          allOf:
            - $ref: '#/components/schemas/EmbedImage'
          nullable: true
        thumbnail:
          allOf:
            - $ref: '#/components/schemas/EmbedThumbnail'
          nullable: true
        video:
          allOf:
            - $ref: '#/components/schemas/EmbedVideo'
          nullable: true
        author:
          allOf:
            - $ref: '#/components/schemas/EmbedAuthor'
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/EmbedField'
    Message:
      type: object
      required: [id, channel_id, author_id, webhook_id, content, created_at, reply_to_id, edited_at, embeds, attachments, mention_everyone, mentions, mention_roles, pinned, reactions]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        channel_id:
          $ref: '#/components/schemas/Id'
          description: >-
            Id of the channel the message belongs to. Always present, so a
            client can locate the message regardless of which endpoint returned
            it.
        author_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: >-
            Author user id; null for a webhook message (which carries
            `webhook_id` instead). `author_id` and `webhook_id` are mutually
            exclusive.
        webhook_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: >-
            Webhook id when the message was posted by a webhook; null for a user
            message. Use `GET /api/webhooks/{webhook_id}` to resolve its
            name/avatar.
        content:
          type: string
          format: message-body
          description: Sanitized message body (forbidden codepoints stripped on receipt)
        created_at:
          type: integer
          format: int64
          description: Unix epoch, milliseconds
        reply_to_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        edited_at:
          type: integer
          format: int64
          description: Unix epoch, milliseconds
          nullable: true
        embeds:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Embed'
          description: >-
            Null (absent) when the message has no embeds. The server serializes
            unset optional embed fields as explicit nulls and always emits
            `fields` as an array.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: >-
            Ordered attachments of the message; an empty array when there are
            none.
        mention_everyone:
          type: boolean
          description: >-
            True when the content contains `@everyone`/`@here` and it was left
            enabled by `allowed_mentions`.
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: >-
            User ids mentioned in the content (`<@id>` / `<@!id>`), in
            first-appearance order, deduplicated. Ids of missing or deleted
            users are dropped.
        mention_roles:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: >-
            Role ids mentioned in the content (`<@&id>`) that belong to the
            message's guild, in first-appearance order, deduplicated.
        pinned:
          type: boolean
          description: True when the message is pinned in its channel.
        reactions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ReactionSummary'
          description: >-
            Inline aggregated reactions of the message, ordered by the first
            time each emoji was used; null when the message has none. `me` is
            caller-specific. Present on every message read (channel pages,
            single-message read and search); the aggregate reaction endpoint no
            longer exists.
    MessageWithoutId:
      type: object
      required: [channel_id, author_id, webhook_id, content, created_at, reply_to_id, edited_at, embeds, attachments, mention_everyone, mentions, mention_roles, pinned, reactions]
      properties:
        channel_id:
          $ref: '#/components/schemas/Id'
          description: Id of the channel the message belongs to.
        author_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: >-
            Author user id; null for a webhook message (which carries
            `webhook_id` instead). `author_id` and `webhook_id` are mutually
            exclusive.
        webhook_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: >-
            Webhook id when the message was posted by a webhook; null for a user
            message. Use `GET /api/webhooks/{webhook_id}` to resolve its
            name/avatar.
        content:
          type: string
          format: message-body
          description: Sanitized message body (forbidden codepoints stripped on receipt)
        created_at:
          type: integer
          format: int64
          description: Unix epoch, milliseconds
        reply_to_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        edited_at:
          type: integer
          format: int64
          description: Unix epoch, milliseconds
          nullable: true
        embeds:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/Embed'
          description: >-
            Null (absent) when the message has no embeds. The server serializes
            unset optional embed fields as explicit nulls and always emits
            `fields` as an array.
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: >-
            Ordered attachments of the message; an empty array when there are
            none.
        mention_everyone:
          type: boolean
          description: >-
            True when the content contains `@everyone`/`@here` and it was left
            enabled by `allowed_mentions`.
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: >-
            User ids mentioned in the content (`<@id>` / `<@!id>`), in
            first-appearance order, deduplicated. Ids of missing or deleted
            users are dropped.
        mention_roles:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          description: >-
            Role ids mentioned in the content (`<@&id>`) that belong to the
            message's guild, in first-appearance order, deduplicated.
        pinned:
          type: boolean
          description: True when the message is pinned in its channel.
        reactions:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/ReactionSummary'
          description: >-
            Inline aggregated reactions of the message, ordered by the first
            time each emoji was used; null when the message has none. `me` is
            caller-specific.
    GuildMessageSearchResult:
      type: object
      required: [messages, total]
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          description: >-
            The requested page of matching messages, ordered by `sort`. Each
            item carries its `channel_id`.
        total:
          type: integer
          format: int64
          description: >-
            Exact number of messages matching the filters, independent of
            `offset`/`limit`.
    Role:
      type: object
      required: [id, name, position, permissions, color, mentionable]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          format: display-name
          description: >-
            Max `api.roles.max_name_codepoints`; forbidden codepoints (Cc/Cf,
            zero-width, BiDi, ...) are rejected on create/modify with 400
            "'name' is invalid".
        position:
          type: integer
          minimum: 0
          maximum: 32767
          description: >-
            Read-only unique rank within the guild (@everyone is always 0);
            change it through PUT /guilds/{guild_id}/roles/order
        permissions:
          $ref: '#/components/schemas/PermissionBits'
        color:
          type: integer
          minimum: 0
          maximum: 16777215
          nullable: true
        mentionable:
          type: boolean
          description: >-
            Whether members may mention this role. Defaults to `true` on
            creation; role mentions are gated by it (together with the
            `mention_everyone` permission for `@everyone`).
    RoleWithGuild:
      allOf:
        - $ref: '#/components/schemas/Role'
        - type: object
          required: [guild_id]
          properties:
            guild_id:
              $ref: '#/components/schemas/Id'
    Overwrite:
      type: object
      required: [target_id, type, allow, deny]
      properties:
        target_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: role_id or user_id
        type:
          type: string
          enum: [role, member]
        allow:
          $ref: '#/components/schemas/PermissionBits'
        deny:
          $ref: '#/components/schemas/PermissionBits'
    Limits:
      type: object
      required: [guilds, channels, messages, search, sync, audit_log, embeds, roles, emojis, users, auth, media, files, push, webhooks]
      properties:
        guilds:
          type: object
          required: [max_name_codepoints, max_emojis]
          properties:
            max_name_codepoints: { type: integer }
            max_emojis: { type: integer }
        channels:
          type: object
          required: [max_name_codepoints, max_topic_codepoints]
          properties:
            max_name_codepoints: { type: integer }
            max_topic_codepoints: { type: integer }
        messages:
          type: object
          required: [max_messages_limit, max_codepoints_per_message, max_reactions, max_reactions_users_limit, max_embeds, max_attachments, max_mention_users, max_mention_roles, max_allowed_mention_users, max_allowed_mention_roles]
          properties:
            max_messages_limit: { type: integer }
            max_codepoints_per_message: { type: integer }
            max_reactions: { type: integer }
            max_reactions_users_limit: { type: integer }
            max_embeds: { type: integer }
            max_attachments: { type: integer }
            max_mention_users: { type: integer }
            max_mention_roles: { type: integer }
            max_allowed_mention_users: { type: integer }
            max_allowed_mention_roles: { type: integer }
        search:
          type: object
          required: [min_content_codepoints, max_content_codepoints, max_filter_ids]
          properties:
            min_content_codepoints: { type: integer }
            max_content_codepoints: { type: integer }
            max_filter_ids: { type: integer }
        sync:
          type: object
          required: [max_lookback_s]
          properties:
            max_lookback_s: { type: integer }
        audit_log:
          type: object
          required: [max_entries_limit]
          properties:
            max_entries_limit: { type: integer }
        embeds:
          type: object
          required: [max_title_codepoints, max_description_codepoints, max_fields, max_footer_codepoints, max_author_name_codepoints, max_field_name_codepoints, max_field_value_codepoints, max_url_codepoints, max_total_codepoints]
          properties:
            max_title_codepoints: { type: integer }
            max_description_codepoints: { type: integer }
            max_fields: { type: integer }
            max_footer_codepoints: { type: integer }
            max_author_name_codepoints: { type: integer }
            max_field_name_codepoints: { type: integer }
            max_field_value_codepoints: { type: integer }
            max_url_codepoints: { type: integer }
            max_total_codepoints: { type: integer }
        roles:
          type: object
          required: [max_name_codepoints]
          properties:
            max_name_codepoints: { type: integer }
        emojis:
          type: object
          required: [min_name_codepoints, max_name_codepoints]
          properties:
            min_name_codepoints: { type: integer }
            max_name_codepoints: { type: integer }
        users:
          type: object
          required: [min_username_codepoints, max_username_codepoints, min_display_name_codepoints, max_display_name_codepoints, max_userdata_bytes]
          properties:
            min_username_codepoints: { type: integer }
            max_username_codepoints: { type: integer }
            min_display_name_codepoints: { type: integer }
            max_display_name_codepoints: { type: integer }
            max_userdata_bytes: { type: integer }
        auth:
          type: object
          required: [password]
          properties:
            password:
              type: object
              required: [min_codepoints, max_codepoints, max_bytes]
              properties:
                min_codepoints: { type: integer }
                max_codepoints: { type: integer }
                max_bytes: { type: integer }
        media:
          type: object
          required: [avatar, emoji]
          properties:
            avatar:
              type: object
              required: [max_dimensions, max_bytes, max_animation_frames, max_animation_duration_ms]
              properties:
                max_dimensions: { type: integer }
                max_bytes: { type: integer }
                max_animation_frames: { type: integer }
                max_animation_duration_ms: { type: integer }
            emoji:
              type: object
              required: [max_dimensions, max_bytes, max_animation_frames, max_animation_duration_ms]
              properties:
                max_dimensions: { type: integer }
                max_bytes: { type: integer }
                max_animation_frames: { type: integer }
                max_animation_duration_ms: { type: integer }
        files:
          type: object
          required: [max_name_codepoints, max_size, whitelist, public_base_urls]
          properties:
            max_name_codepoints: { type: integer }
            max_size: { type: integer }
            whitelist:
              type: array
              nullable: true
              description: >-
                MIME patterns accepted by `POST /api/files`, mirroring
                `files.whitelist`. `null` allows every type, an empty array
                allows none. An exact `type/subtype` matches that type; a
                `<type>/*` entry (e.g. `text/*`) matches any subtype of that type.
              items:
                type: string
            public_base_urls:
              type: array
              description: >-
                Origins from which files are served
                (`files.s3.public_base_url`); empty when storage is disabled.
                Use these to build a Content-Security-Policy `img-src` /
                `media-src` allowlist. Served with the HTML document, not by the
                API. Files are served cross-origin; the files origin/CDN should
                add `X-Content-Type-Options: nosniff`, `Content-Security-Policy:
                sandbox; default-src 'none'; frame-ancestors 'none'`,
                `Cross-Origin-Resource-Policy: cross-origin` and
                `Referrer-Policy: no-referrer`, since the stored `Content-Type`
                of passthrough types is client-declared.
              items:
                type: string
        push:
          type: object
          description: >-
            Browser Web Push availability. When `enabled` is false the
            subscription endpoints still store rows but no notification is
            delivered. `vapid_public_key` is the base64url `applicationServerKey`
            the client passes to `PushManager.subscribe`.
          required: [enabled, vapid_public_key, max_subscriptions_per_user]
          properties:
            enabled: { type: boolean }
            vapid_public_key: { type: string }
            max_subscriptions_per_user: { type: integer }
        webhooks:
          type: object
          required: [max_webhooks_per_channel, max_name_codepoints]
          properties:
            max_webhooks_per_channel: { type: integer }
            max_name_codepoints: { type: integer }
    SyncCursor:
      type: integer
      description: >-
        Server cursor: the database `now()` captured at query start, in epoch
        milliseconds. Store it and pass it as the next `since`.
    GuildSync:
      type: object
      required: [updated_at, channels, roles, emojis, overwrites, member_roles]
      properties:
        updated_at:
          $ref: '#/components/schemas/SyncCursor'
        channels:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        emojis:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        overwrites:
          type: array
          items:
            type: object
            required: [channel_id, target_id, type]
            properties:
              channel_id:
                $ref: '#/components/schemas/Id'
              target_id:
                $ref: '#/components/schemas/Id'
              type:
                type: string
                enum: [role, member]
        member_roles:
          type: array
          description: The caller's complete current role-id set in this guild.
          items:
            $ref: '#/components/schemas/Id'
    MessagesSync:
      type: object
      required: [updated_at, messages]
      properties:
        updated_at:
          $ref: '#/components/schemas/SyncCursor'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Id'
    UsersSync:
      type: object
      required: [updated_at, users]
      properties:
        updated_at:
          $ref: '#/components/schemas/SyncCursor'
        users:
          type: array
          items:
            $ref: '#/components/schemas/Id'
