          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds:
    get:
      summary: List guilds
      tags: [guilds]
      operationId: getGuilds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guild'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /guilds/{guild_id}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    patch:
      summary: Update a guild
      description: >-
        Requires `guild_modify` on the guild. Only `name` can be changed. A
        body without a recognized field (e.g. `{}`) is 400 "Nothing to update".
        Dispatches a `guild_updated` gateway event on success.
      tags: [guilds]
      operationId: patchGuild
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  format: display-name
                  description: Max `api.guilds.max_name_codepoints`
      responses:
        '204':
          description: No Content
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (guild_modify required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds/{guild_id}/sync:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: Changed guild entities since a cursor
      tags: [sync]
      operationId: getGuildSync
      security:
        - bearerAuth: []
      description: >-
        Per-guild changed-since delta. Every field is an array of ids of present
        rows whose `updated_at` is newer than `since` (upserts); entity bodies
        are never returned. `overwrites` carry their `channel_id` because
        `(target_type, target_id)` is not unique within a guild. `member_roles`
        is the caller's complete current role-id set (not filtered by `since`),
        because grant/revoke hard-delete the row and a delta cannot express
        revocation. Hard deletions are not listed; the client reconciles them
        with a periodic full refetch or gateway events. Metadata is readable by
        any authenticated user.
      parameters:
        - $ref: '#/components/parameters/Since'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildSync'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds/{guild_id}/avatar:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: Get a guild's avatar image
      description: >-
        Public endpoint, no authentication required. Streams the stored webp
        (or animated webp) avatar. The `hash` query parameter is required and
        must equal the guild's current `avatar_hash`, otherwise 404. The
        response is immutable for a given hash, so it is safe to cache.
      tags: [guilds]
      operationId: getGuildAvatar
      security: []
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{16}$'
      responses:
        '200':
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Avatar not found (unknown guild, no avatar, or hash mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Set a guild's avatar
      description: >-
        Requires `guild_modify` on the guild. Uploads a static or animated
        image, within `media.avatar.max_dimensions`,
        `media.avatar.max_input_bytes` and the `media.avatar` animation caps.
        The `Content-Type` must be `image/webp`, `image/gif`, `image/png`,
        `image/jpeg` or `image/jpg`; unsupported types are rejected with `415`.
        Images are re-encoded to WebP
        (animations to animated WebP); the response contains the stored
        `avatar_hash` (XXHash64, 16 lowercase hex chars). The body must be
        non-empty.
        Use `DELETE` to clear the avatar; a PUT never clears it.
        Every successful change dispatches a `guild_updated` gateway event.
      tags: [guilds]
      operationId: putGuildAvatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: >-
          Raw image bytes. The request `Content-Type` must be `image/webp`,
          `image/gif`, `image/png`, `image/jpeg` or `image/jpg`; any other
          type is rejected with 415.
      responses:
        '200':
          description: Avatar stored
          content:
            application/json:
              schema:
                type: object
                required: [avatar_hash]
                properties:
                  avatar_hash:
                    type: string
                    pattern: '^[0-9a-f]{16}$'
        '400':
          description: >-
            The body is empty or not a decodable WebP/GIF/PNG/JPEG, or exceeds
            media.avatar.max_dimensions or the animation caps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body exceeds media.avatar.max_input_bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The content type is not image/webp, image/gif, image/png, image/jpeg or image/jpg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (guild_modify required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Clear a guild's avatar
      description: >-
        Requires `guild_modify` on the guild. Removes the stored avatar.
        Idempotent: clearing a guild that has no avatar is still 204.
        Dispatches a `guild_updated` gateway event.
      tags: [guilds]
      operationId: deleteGuildAvatar
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No Content (the avatar was cleared)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (guild_modify required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /guilds/{guild_id}/emojis:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      summary: List a guild's custom emojis
      description: >-
        Requires authentication (any logged-in user). Keyset-paginated by emoji
        `id` (ascending); `after` continues past an id. Only this guild's emojis
        are returned.
      tags: [emojis]
      operationId: getGuildEmojis
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: >-
            Default 50; must be > 0 and <= `api.emojis.max_emojis_limit`.
        - name: after
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
          description: Return emojis with an id strictly greater than this one.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Emoji'
        '400':
          description: A bad/unknown query parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a custom emoji
      description: >-
        Requires `create_emoji` on the guild. The name travels in the query
        string (the server does not percent-decode query values, so clients must
        send the name bytes verbatim) and the body is a raw image with
        `Content-Type` `image/webp`, `image/gif`, `image/png`, `image/jpeg` or
        `image/jpg` (an unsupported
        type is `415`). The upload must be within the `media.emoji` caps; it is
        re-encoded to WebP (animations to animated WebP) and stored. The guild
        may hold at most `api.guilds.max_emojis` emojis. Names are unique per
        guild. Dispatches an `emoji_created` gateway event.
      tags: [emojis]
      operationId: postGuildEmoji
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
            format: emoji-name
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
        description: >-
          Raw image bytes. The request `Content-Type` must be `image/webp`,
          `image/gif`, `image/png`, `image/jpeg` or `image/jpg`; any other
          type is rejected with 415.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Emoji'
        '400':
          description: >-
            Guild not found, bad image, missing/too long/too short/invalid name,
            unknown query parameter, or the guild reached `api.guilds.max_emojis`
            ("Too many emojis")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Missing permissions (create_emoji required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Guild not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Emoji name is already used
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The body exceeds media.emoji.max_input_bytes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: The content type is not image/webp, image/gif, image/png, image/jpeg or image/jpg
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /emojis/{emoji_id}:
    parameters:
      - $ref: '#/components/parameters/EmojiId'
    patch:
      summary: Rename a custom emoji
      description: >-
        Requires `modify_emoji` on the emoji's guild. The body is a JSON object
        with a single `name` field; the name is not nullable. A duplicate name
